<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AiShot — Documentation</title>
  <meta name="description" content="AiShot — AI-powered screenshot tool for Windows. Usage guide & technical docs (EN/PT/ES)." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="https://cdn.jsdelivr.net/gh/thiagovasconcelosti/AiShot@master/installer/aishot.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <style>
    :root { --theme-color: #2F6BFF; }
    .app-name-link img { width: 34px; vertical-align: middle; }
    .markdown-section { max-width: 900px; }
  </style>
</head>
<body>
  <div id="app">Loading…</div>
  <script>
    window.$docsify = {
      name: 'AiShot',
      logo: 'https://cdn.jsdelivr.net/gh/thiagovasconcelosti/AiShot@master/installer/aishot.png',
      repo: 'https://github.com/thiagovasconcelosti/AiShot',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 3,
      auto2top: true,
      maxLevel: 4,
      alias: {
        '/pt/_navbar.md': '/_navbar.md',
        '/es/_navbar.md': '/_navbar.md',
        '/.*/_navbar.md': '/_navbar.md'
      },
      search: {
        placeholder: 'Search / Buscar / Pesquisar',
        noData: 'No results.',
        depth: 4
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-csharp.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
